name: Auto Fetching 

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:

jobs:
  fetch_nifty50:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Fetch Nifty 50 and Add Timestamp
      run: |
        curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.niftyindices.com/IndexConstituent/ind_nifty50list.csv" > temp.csv
        CURRENT_TIME=$(env TZ=Asia/Kolkata date "+%Y-%m-%d %H:%M:%S IST")
        awk -v time="$CURRENT_TIME" 'NR==1 {print $0 ",Fetch_Time"} NR>1 {print $0 "," time}' temp.csv > ind_nifty50list.csv
        rm temp.csv

    - name: Push to Grist Sheet and Fully Dynamic Sync
      env:
        GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
        GRIST_TABLE_ID: ${{ secrets.GRIST_TABLE_ID }}
      run: |
        python3 -c "
        import csv, json, os, urllib.request, re

        api_key = os.environ['GRIST_API_KEY']
        doc_id = os.environ['GRIST_DOC_ID']
        table_id = os.environ['GRIST_TABLE_ID']

        # 1. Read headers directly from the CSV dynamically
        with open('ind_nifty50list.csv', mode='r', encoding='utf-8-sig') as f:
            reader = csv.reader(f)
            csv_headers = next(reader)
            
            col_mapping = {}
            required_col_ids = []
            symbol_col_id = None

            for idx, h in enumerate(csv_headers):
                label = h.strip()
                if not label: continue
                
                # Create a safe Grist column ID (no spaces/special chars)
                safe_id = re.sub(r'[^a-zA-Z0-9]', '_', label)
                # Avoid starting with a number if header is numeric
                if safe_id and safe_id[0].isdigit():
                    safe_id = 'col_' + safe_id

                col_mapping[idx] = {'id': safe_id, 'label': label}
                required_col_ids.append(safe_id)

                # Find which column acts as the unique symbol matcher
                if 'symbol' in label.lower():
                    symbol_col_id = safe_id

            if not symbol_col_id:
                print('Error: Could not identify a Symbol column in the CSV headers.')
                exit(1)

            # 2. Fetch existing columns in Grist
            cols_url = f'https://docs.getgrist.com/api/docs/{doc_id}/tables/{table_id}/columns'
            req_cols = urllib.request.Request(cols_url, headers={'Authorization': f'Bearer {api_key}'}, method='GET')
            
            existing_cols = []
            try:
                with urllib.request.urlopen(req_cols) as resp:
                    data = json.loads(resp.read().decode('utf-8'))
                    for col in data.get('columns', []):
                        cid = col.get('id')
                        if cid and cid != 'id':
                            existing_cols.append(cid)
            except Exception as e:
                print(f'Warning: Could not fetch existing columns: {e}')

            # 3. Delete extra columns that are not currently in the CSV
            for cid in existing_cols:
                if cid not in required_col_ids:
                    del_url = f'{cols_url}/{cid}'
                    del_req = urllib.request.Request(del_url, headers={'Authorization': f'Bearer {api_key}'}, method='DELETE')
                    try:
                        with urllib.request.urlopen(del_req):
                            print(f'Deleted outdated column: {cid}')
                    except Exception as e:
                        print(f'Could not delete column {cid}: {e}')

            # 4. Create missing columns automatically based on the CSV headers
            missing_cols = [cid for cid in required_col_ids if cid not in existing_cols]
            if missing_cols:
                new_cols_payload = []
                for cid in missing_cols:
                    # Find matching label for this safe_id
                    label = next(info['label'] for info in col_mapping.values() if info['id'] == cid)
                    new_cols_payload.append({
                        'id': cid,
                        'fields': {
                            'label': label,
                            'type': 'Text'
                        }
                    })
                
                add_col_data = json.dumps({'columns': new_cols_payload}).encode('utf-8')
                req_add_cols = urllib.request.Request(
                    cols_url,
                    data=add_col_data,
                    headers={
                        'Authorization': f'Bearer {api_key}',
                        'Content-Type': 'application/json'
                    },
                    method='POST'
                )
                try:
                    with urllib.request.urlopen(req_add_cols) as resp:
                        print(f'Successfully created missing columns dynamically: {missing_cols}')
                except urllib.error.HTTPError as e:
                    print(f'Error creating columns: {e.code} - {e.read().decode(\"utf-8\")}')
                    exit(1)

            # 5. Parse rows using dynamic column IDs
            records = []
            for row in reader:
                if not row or not any(row): continue
                fields = {}
                symbol_val = ''
                
                for idx, info in col_mapping.items():
                    if idx < len(row):
                        val = row[idx].strip()
                        cid = info['id']
                        fields[cid] = val
                        if cid == symbol_col_id:
                            symbol_val = val
                
                if symbol_val:
                    records.append({'require': {symbol_col_id: symbol_val}, 'fields': fields})

        if not records:
            print('Error: No valid records parsed from CSV.')
            exit(1)

        # 6. Send records in batches via PUT (Upsert)
        records_url = f'https://docs.getgrist.com/api/docs/{doc_id}/tables/{table_id}/records'
        for i in range(0, len(records), 100):
            batch = records[i:i+100]
            data = json.dumps({'records': batch}).encode('utf-8')
            req = urllib.request.Request(
                records_url, 
                data=data, 
                headers={
                    'Authorization': f'Bearer {api_key}', 
                    'Content-Type': 'application/json'
                }, 
                method='PUT'
            )
            try:
                with urllib.request.urlopen(req) as response:
                    print(response.read().decode('utf-8'))
            except urllib.error.HTTPError as e:
                print(f'Error syncing to Grist: {e.code} - {e.read().decode(\"utf-8\")}')
                exit(1)

        print('Successfully synced data and dynamically matched CSV headers with Grist!')
        "

    - name: Commit and Force Push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ind_nifty50list.csv
        git commit -m "Nifty 50 Force Updated" || exit 0
        git push origin main --force
