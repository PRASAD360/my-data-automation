name: Auto Fetch Nifty 50 CSV

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:

jobs:
  fetch_nifty50:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Fetch Nifty 50 and Add Timestamp
      run: |
        curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.niftyindices.com/IndexConstituent/ind_nifty50list.csv" > temp.csv
        CURRENT_TIME=$(env TZ=Asia/Kolkata date "+%Y-%m-%d %H:%M:%S IST")
        awk -v time="$CURRENT_TIME" 'NR==1 {print $0 ",Fetch_Time"} NR>1 {print $0 "," time}' temp.csv > ind_nifty50list.csv
        rm temp.csv

    - name: Push to Grist Sheet
      env:
        GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
        GRIST_TABLE_ID: ${{ secrets.GRIST_TABLE_ID }}
      run: |
        python3 -c "
        import csv, json, os, urllib.request, re

        api_key = os.environ['GRIST_API_KEY']
        doc_id = os.environ['GRIST_DOC_ID']
        table_id = os.environ['GRIST_TABLE_ID']
        url = f'https://docs.getgrist.com/api/docs/{doc_id}/tables/{table_id}/records'

        def clean_key(key):
            # Normalizes header text (e.g., 'Company Name' -> 'company_name' or handles variations)
            if not key: return ''
            return re.sub(r'[^a-zA-Z0-9]', '', key).lower()

        records = []
        with open('ind_nifty50list.csv', mode='r', encoding='utf-8-sig') as f:
            reader = csv.reader(f)
            headers = next(reader)
            
            # Map column positions based on expected terms to stay robust against minor header edits
            col_map = {}
            for idx, h in enumerate(headers):
                h_clean = clean_key(h)
                if 'company' in h_clean: col_map[idx] = 'Company Name'
                elif 'industry' in h_clean: col_map[idx] = 'Industry'
                elif 'symbol' in h_clean: col_map[idx] = 'Symbol'
                elif 'series' in h_clean: col_map[idx] = 'Series'
                elif 'isin' in h_clean: col_map[idx] = 'ISIN Code'
                elif 'fetch' in h_clean or 'time' in h_clean: col_map[idx] = 'Fetch_Time'

            for row in reader:
                if not row or not any(row): continue
                fields = {}
                symbol_val = ''
                
                for idx, val in enumerate(row):
                    if idx in col_map:
                        col_name = col_map[idx]
                        fields[col_name] = val.strip()
                        if col_name == 'Symbol':
                            symbol_val = val.strip()

                if symbol_val:
                    records.append({'require': {'Symbol': symbol_val}, 'fields': fields})

        if not records:
            print('Error: No valid records parsed from CSV.')
            exit(1)

        # Send in batches of 100
        for i in range(0, len(records), 100):
            batch = records[i:i+100]
            data = json.dumps({'records': batch}).encode('utf-8')
            req = urllib.request.Request(
                url, 
                data=data, 
                headers={
                    'Authorization': f'Bearer {api_key}', 
                    'Content-Type': 'application/json'
                }, 
                method='PUT'
            )
            try:
                with urllib.request.urlopen(req) as response:
                    print(response.read().decode('utf-8'))
            except urllib.error.HTTPError as e:
                print(f'Error syncing to Grist: {e.code} - {e.read().decode(\"utf-8\")}')
                exit(1)
        print('Successfully synced Nifty 50 data to Grist robustly!')
        "

    - name: Commit and Force Push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ind_nifty50list.csv
        git commit -m "Nifty 50 Force Updated" || exit 0
        git push origin main --force
