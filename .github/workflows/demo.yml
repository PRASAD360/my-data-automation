name: Auto Fetch Nifty 50 CSV

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:

jobs:
  fetch_nifty50:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Fetch Nifty 50 and Add Timestamp
      run: |
        curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.niftyindices.com/IndexConstituent/ind_nifty50list.csv" > temp.csv
        CURRENT_TIME=$(env TZ=Asia/Kolkata date "+%Y-%m-%d %H:%M:%S IST")
        awk -v time="$CURRENT_TIME" 'NR==1 {print $0 ",Fetch_Time"} NR>1 {print $0 "," time}' temp.csv > ind_nifty50list.csv
        rm temp.csv

    - name: Push to Grist Sheet and Auto-Create Columns
      env:
        GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
        GRIST_TABLE_ID: ${{ secrets.GRIST_TABLE_ID }}
      run: |
        python3 -c "
        import csv, json, os, urllib.request, re

        api_key = os.environ['GRIST_API_KEY']
        doc_id = os.environ['GRIST_DOC_ID']
        table_id = os.environ['GRIST_TABLE_ID']

        def clean_key(key):
            if not key: return ''
            return re.sub(r'[^a-zA-Z0-9]', '', key).lower()

        # 1. Read CSV headers and map columns dynamically
        with open('ind_nifty50list.csv', mode='r', encoding='utf-8-sig') as f:
            reader = csv.reader(f)
            csv_headers = next(reader)
            
            targets = {
                'company': 'Company Name',
                'industry': 'Industry',
                'symbol': 'Symbol',
                'series': 'Series',
                'isin': 'ISIN Code',
                'fetch': 'Fetch_Time',
                'time': 'Fetch_Time'
            }

            detected_cols = {}
            for idx, h in enumerate(csv_headers):
                h_clean = clean_key(h)
                for keyword, label in targets.items():
                    if keyword in h_clean:
                        detected_cols[label] = idx
                        break

            required_labels = ['Company Name', 'Industry', 'Symbol', 'Series', 'ISIN Code', 'Fetch_Time']

            # 2. Check existing columns in Grist
            cols_url = f'https://docs.getgrist.com/api/docs/{doc_id}/tables/{table_id}/columns'
            req_cols = urllib.request.Request(cols_url, headers={'Authorization': f'Bearer {api_key}'}, method='GET')
            
            existing_labels = set()
            try:
                with urllib.request.urlopen(req_cols) as resp:
                    data = json.loads(resp.read().decode('utf-8'))
                    for col in data.get('columns', []):
                        fields = col.get('fields', {})
                        label = fields.get('label', col.get('id'))
                        if label:
                            existing_labels.add(label)
            except Exception as e:
                print(f'Warning: Could not fetch existing columns: {e}')

            # 3. Automatically create missing columns via API if they don't exist
            missing_labels = [label for label in required_labels if label not in existing_labels]
            if missing_labels:
                new_cols_payload = []
                for label in missing_labels:
                    safe_id = re.sub(r'[^a-zA-Z0-9]', '_', label)
                    new_cols_payload.append({
                        'id': safe_id,
                        'fields': {
                            'label': label,
                            'type': 'Text'
                        }
                    })
                
                add_col_data = json.dumps({'columns': new_cols_payload}).encode('utf-8')
                req_add_cols = urllib.request.Request(
                    cols_url,
                    data=add_col_data,
                    headers={
                        'Authorization': f'Bearer {api_key}',
                        'Content-Type': 'application/json'
                    },
                    method='POST'
                )
                try:
                    with urllib.request.urlopen(req_add_cols) as resp:
                        print(f'Successfully auto-created missing Grist columns: {missing_labels}')
                except urllib.error.HTTPError as e:
                    print(f'Error creating columns automatically: {e.code} - {e.read().decode(\"utf-8\")}')
                    exit(1)

            # 4. Parse rows into records
            records = []
            for row in reader:
                if not row or not any(row): continue
                fields = {}
                symbol_val = ''
                
                for label, idx in detected_cols.items():
                    if idx < len(row):
                        val = row[idx].strip()
                        fields[label] = val
                        if label == 'Symbol':
                            symbol_val = val
                
                if symbol_val:
                    records.append({'require': {'Symbol': symbol_val}, 'fields': fields})

        if not records:
            print('Error: No valid records parsed from CSV.')
            exit(1)

        # 5. Send records in batches via PUT (Upsert)
        records_url = f'https://docs.getgrist.com/api/docs/{doc_id}/tables/{table_id}/records'
        for i in range(0, len(records), 100):
            batch = records[i:i+100]
            data = json.dumps({'records': batch}).encode('utf-8')
            req = urllib.request.Request(
                records_url, 
                data=data, 
                headers={
                    'Authorization': f'Bearer {api_key}', 
                    'Content-Type': 'application/json'
                }, 
                method='PUT'
            )
            try:
                with urllib.request.urlopen(req) as response:
                    print(response.read().decode('utf-8'))
            except urllib.error.HTTPError as e:
                print(f'Error syncing to Grist: {e.code} - {e.read().decode(\"utf-8\")}')
                exit(1)

        print('Successfully synced Nifty 50 data and auto-managed columns in Grist!')
        "

    - name: Commit and Force Push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ind_nifty50list.csv
        git commit -m "Nifty 50 Force Updated" || exit 0
        git push origin main --force
