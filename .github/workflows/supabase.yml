    - name: Single Table Sync (Atomic Update)
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        SUPABASE_TABLE: ${{ github.event.inputs.table_name || 'TRADING' }}
      run: |
        python3 -c "
        import csv, os, re
        import psycopg2

        db_url = os.environ['SUPABASE_DB_URL'].strip()
        table_name = os.environ['SUPABASE_TABLE']
        
        # 1. Read and Validate CSV
        rows_data = []
        safe_headers = []
        with open('target_list.csv', mode='r', encoding='utf-8-sig') as f:
            reader = csv.reader(f)
            csv_headers = next(reader)
            safe_headers = [re.sub(r'[^a-zA-Z0-9]', '_', h.strip()).lower() for h in csv_headers]
            for row in reader:
                if any(row): rows_data.append(tuple(row))

        # AGAR DATA NAHI HAI, TOH SCRIPT YAHIN RUK JAYEGI (Database safe rahega)
        if not rows_data:
            print('No valid data in CSV, skipping update.')
            exit(1)

        # 2. Sync inside one transaction
        conn = psycopg2.connect(db_url)
        cur = conn.cursor()
        try:
            # Purana data tabhi delete hoga agar upar wala code success hua
            print(f'Updating table: {table_name}')
            cur.execute(f'TRUNCATE TABLE {table_name} RESTART IDENTITY;')
            
            # Insert logic
            cols_str = ', '.join([f'\"{c}\"' for c in safe_headers])
            insert_query = f'INSERT INTO {table_name} ({cols_str}) VALUES (' + ','.join(['%s']*len(safe_headers)) + ')'
            cur.executemany(insert_query, rows_data)
            
            conn.commit()
            print('Sync complete. Data updated successfully.')
        except Exception as e:
            conn.rollback()
            print(f'Error occurred, database unchanged: {e}')
            exit(1)
        finally:
            cur.close()
            conn.close()
        "
