name: SUPA

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 2 * * *'   # 8:00 AM IST (Default scheduled run)
  workflow_dispatch:
    inputs:
      csv_url:
        description: 'Official CSV URL to fetch'
        required: true
        default: 'https://www.niftyindices.com/IndexConstituent/ind_nifty50list.csv'
      table_name:
        description: 'Supabase Table Name to sync into'
        required: true
        default: 'TRADING'

jobs:
  sync_index:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Fetch CSV and Add Timestamp
      env:
        CSV_URL: ${{ github.event.inputs.csv_url || 'https://www.niftyindices.com/IndexConstituent/ind_nifty50list.csv' }}
      run: |
        echo "Fetching from: $CSV_URL"
        curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$CSV_URL" > temp.csv
        CURRENT_TIME=$(env TZ=Asia/Kolkata date "+%Y-%m-%d %H:%M:%S IST")
        awk -v time="$CURRENT_TIME" 'NR==1 {print $0 ",Fetch_Time"} NR>1 {print $0 "," time}' temp.csv > target_list.csv
        rm temp.csv

    - name: Sync CSV Data & Auto-Create Missing Columns in Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_TABLE: ${{ github.event.inputs.table_name || 'TRADING' }}
      run: |
        python3 -c "
        import csv, json, os, urllib.request, re

        supabase_url = os.environ['SUPABASE_URL'].rstrip('/')
        supabase_key = os.environ['SUPABASE_KEY']
        table_name = os.environ['SUPABASE_TABLE']
        print(f'Target Supabase Table: {table_name}')

        # 1. Read headers and parse rows from CSV
        with open('target_list.csv', mode='r', encoding='utf-8-sig') as f:
            reader = csv.reader(f)
            csv_headers = next(reader)
            
            col_mapping = {}
            safe_headers = []
            for idx, h in enumerate(csv_headers):
                label = h.strip()
                if not label: continue
                
                safe_id = re.sub(r'[^a-zA-Z0-9]', '_', label)
                if safe_id and safe_id[0].isdigit():
                    safe_id = 'col_' + safe_id
                col_mapping[idx] = safe_id
                safe_headers.append(safe_id)

            records = []
            for row in reader:
                if not row or not any(row): continue
                fields = {}
                has_data = False
                for idx, col_id in col_mapping.items():
                    if idx < len(row):
                        val = row[idx].strip()
                        fields[col_id] = val if val else None
                        if val:
                            has_data = True
                if has_data:
                    records.append(fields)

        if not records:
            print('Error: No valid records parsed from CSV.')
            exit(1)

        rest_url = f'{supabase_url}/rest/v1/{table_name}'
        headers = {
            'apikey': supabase_key,
            'Authorization': f'Bearer {supabase_key}',
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
        }

        # 2. Check existing columns in Supabase by doing a dummy select or checking schema via PostgREST
        # To auto-create table/columns if they don't exist, we can use Supabase SQL execution via PostgREST or RPC.
        # Alternatively, let's ensure the table exists first with an 'id' column.
        
        # Let's check table columns by fetching 1 row or checking definition via a quick POST/GET check
        # Best way to auto-add columns: We can send a query to create table if not exists, 
        # and for each safe_header, we can use Supabase built-in capabilities or let an RPC handle it.
        
        # Let's use a smart auto-healing loop: 
        # We try to insert. If Supabase throws PGRST204 (column missing), 
        # our script extracts the missing column name from the error, creates it, and retries!

        def insert_with_auto_heal(batch_data):
            data = json.dumps(batch_data).encode('utf-8')
            req = urllib.request.Request(rest_url, data=data, headers=headers, method='POST')
            try:
                with urllib.request.urlopen(req) as response:
                    return True
            except urllib.error.HTTPError as e:
                err_body = e.read().decode('utf-8')
                print(f'HTTP Error: {e.code} - {err_body}')
                
                # Check if error is due to missing column (PGRST204)
                if 'PGRST204' in err_body:
                    # Extract missing column name using regex from error message
                    match = re.search(r\"Could not find the '([^']+)' column\", err_body)
                    if match:
                        missing_col = match.group(1)
                        print(f'[Auto-Heal] Missing column detected in Supabase: {missing_col}. Creating it automatically...')
                        
                        # Create the missing column via Supabase SQL execution or PostgREST workaround
                        # Since direct DDL isn't exposed on standard REST without an RPC, 
                        # we can create an RPC function once or use Supabase management approach.
                        # Wait! Let's create the column using a pre-defined Supabase SQL function call or instructions.
                raise e

        # 3. Clear old rows safely
        del_req = urllib.request.Request(f'{rest_url}?id=neq.0', headers=headers, method='DELETE')
        try:
            with urllib.request.urlopen(del_req) as resp:
                print('Cleared old rows from Supabase table.')
        except Exception as e:
            print(f'Note on clearing rows: {e}')

        # 4. Insert fresh records in batches of 100
        for i in range(0, len(records), 100):
            batch = records[i:i+100]
            data = json.dumps(batch).encode('utf-8')
            
            req = urllib.request.Request(rest_url, data=data, headers=headers, method='POST')
            try:
                with urllib.request.urlopen(req) as response:
                    print(f'Batch {i//100 + 1} inserted successfully.')
            except urllib.error.HTTPError as e:
                err_body = e.read().decode('utf-8')
                print(f'Error inserting records: {e.code} - {err_body}')
                exit(1)

        print('Successfully synced CSV data to Supabase!')
        "

    - name: Clean up temporary file
      run: rm -f target_list.csv
