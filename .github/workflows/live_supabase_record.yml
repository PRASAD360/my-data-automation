name: YFINANCE_LIVE_SYNC

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:
    inputs:
      new_table_name:
        description: 'New Supabase Table Name for Live Data'
        required: true
        default: 'LIVE_TRADING'

jobs:
  sync_live_market:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install psycopg2-binary yfinance pandas pytz

    - name: Pull Live Data via yfinance & Sync to New Table
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        NEW_TABLE_NAME: ${{ github.event.inputs.new_table_name || 'LIVE_TRADING' }}
      run: |
        python3 -c "
        import os, re
        from datetime import datetime
        import psycopg2
        import pytz
        import yfinance as yf

        db_url = os.environ['SUPABASE_DB_URL'].strip()
        table_name = os.environ['NEW_TABLE_NAME'].strip().lower()
        print(f'Target New Supabase Table: {table_name}')

        # 1. Connect to database and fetch symbols from TRADING table
        conn = psycopg2.connect(db_url)
        cur = conn.cursor()

        try:
            cur.execute('SELECT symbol FROM trading;')
            rows = cur.fetchall()
            symbols = [row[0].strip() for row in rows if row[0]]
        except Exception as e:
            print(f'Error reading symbols from trading table: {e}')
            exit(1)

        if not symbols:
            print('Error: No symbols found in TRADING table.')
            exit(1)

        print(f'Found symbols to process: {symbols}')

        # 2. Fetch live data for each symbol using yfinance
        current_time = datetime.now(pytz.timezone('Asia/Kolkata')).strftime('%Y-%m-%d %H:%M:%S IST')
        all_records = []

        for sym in symbols:
            yf_sym = sym if '.' in sym else f'{sym}.NS'
            print(f'Fetching live data for: {yf_sym}')
            try:
                ticker = yf.Ticker(yf_sym)
                info = ticker.info
                if not info or len(info) < 5:
                    print(f'Skipping {yf_sym}, insufficient info returned.')
                    continue

                record = {
                    'fetch_time': current_time,
                    'symbol': sym
                }

                for k, v in info.items():
                    if isinstance(v, (list, dict)):
                        continue
                    safe_key = re.sub(r'[^a-zA-Z0-9]', '_', k).lower()
                    record[safe_key] = str(v) if v is not None else None

                all_records.append(record)
            except Exception as e:
                print(f'Error fetching data for {yf_sym}: {e}')

        if not all_records:
            print('Error: No live records fetched from yfinance.')
            exit(1)

        all_keys = set()
        for rec in all_records:
            all_keys.update(rec.keys())

        ordered_cols = ['fetch_time', 'symbol'] + sorted([k for k in all_keys if k not in ['fetch_time', 'symbol']])

        try:
            # 3. Create New Table if it doesn't exist
            cur.execute(f'CREATE TABLE IF NOT EXISTS {table_name} (id SERIAL PRIMARY KEY);')
            conn.commit()

            cur.execute('''
                SELECT column_name 
                FROM information_schema.columns 
                WHERE table_name = %s;
            ''', (table_name.lower(),))
            existing_cols = [row[0] for row in cur.fetchall()]

            for col in ordered_cols:
                if col not in existing_cols:
                    print(f'[Auto-Create] Adding column to {table_name}: {col}')
                    cur.execute(f'ALTER TABLE {table_name} ADD COLUMN IF NOT EXISTS \"{col}\" TEXT;')
                    conn.commit()

            # 4. Truncate new table and reset IDs to 1
            print(f'Refreshing {table_name} table and resetting IDs to 1...')
            cur.execute(f'TRUNCATE TABLE {table_name} RESTART IDENTITY;')

            # 5. Insert live data securely
            cols_string = ', '.join([f'\"{c}\"' for c in ordered_cols])
            placeholders = ', '.join(['%s'] * len(ordered_cols))
            insert_query = f'INSERT INTO {table_name} ({cols_string}) VALUES ({placeholders});'

            rows_data = []
            for rec in all_records:
                row_vals = [rec.get(col) for col in ordered_cols]
                rows_data.append(tuple(row_vals))

            cur.executemany(insert_query, rows_data)
            conn.commit()

            print(f'Successfully pulled live data via yfinance and saved into table: {table_name}!')

        except Exception as e:
            conn.rollback()
            print(f'Database error occurred: {e}')
            exit(1)
        finally:
            cur.close()
            conn.close()
        "
