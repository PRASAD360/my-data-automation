name: YFINANCE_OHLCV_SYNC

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:
    inputs:
      new_table_name:
        description: 'New Supabase Table Name for OHLCV Data'
        required: true
        default: 'live_ohlcv'

jobs:
  sync_ohlcv:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install psycopg2-binary yfinance pandas pytz

    - name: Pull OHLCV via yfinance & Sync to New Table
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        NEW_TABLE_NAME: ${{ github.event.inputs.new_table_name || 'live_ohlcv' }}
      run: |
        python3 -c "
        import os
        from datetime import datetime
        import psycopg2
        import pytz
        import yfinance as yf

        db_url = os.environ['SUPABASE_DB_URL'].strip()
        table_name = os.environ['NEW_TABLE_NAME'].strip().lower()
        print(f'Target Table: {table_name}')

        # 1. Connect and fetch symbols from trading table
        conn = psycopg2.connect(db_url)
        cur = conn.cursor()

        try:
            cur.execute('SELECT symbol FROM trading;')
            rows = cur.fetchall()
            symbols = [row[0].strip() for row in rows if row[0]]
        except Exception as e:
            print(f'Error reading symbols from trading table: {e}')
            exit(1)

        if not symbols:
            print('Error: No symbols found in TRADING table.')
            exit(1)

        print(f'Found symbols: {symbols}')

        # 2. Fetch OHLCV data using yfinance
        current_time = datetime.now(pytz.timezone('Asia/Kolkata')).strftime('%Y-%m-%d %H:%M:%S IST')
        all_records = []

        for sym in symbols:
            yf_sym = sym if '.' in sym else f'{sym}.NS'
            print(f'Fetching OHLCV for: {yf_sym}')
            try:
                df = yf.Ticker(yf_sym).history(period='1d')
                if df.empty:
                    print(f'No data found for {yf_sym}')
                    continue
                
                latest = df.iloc[-1]
                record = {
                    'fetch_time': current_time,
                    'symbol': sym,
                    'open': str(round(latest['Open'], 2)),
                    'high': str(round(latest['High'], 2)),
                    'low': str(round(latest['Low'], 2)),
                    'close': str(round(latest['Close'], 2)),
                    'volume': str(int(latest['Volume']))
                }
                all_records.append(record)
            except Exception as e:
                print(f'Error fetching {yf_sym}: {e}')

        if not all_records:
            print('Error: No records fetched.')
            exit(1)

        ordered_cols = ['fetch_time', 'symbol', 'open', 'high', 'low', 'close', 'volume']

        try:
            # 3. Create new table if not exists
            cur.execute(f'CREATE TABLE IF NOT EXISTS {table_name} (id SERIAL PRIMARY KEY);')
            conn.commit()

            cur.execute('''
                SELECT column_name 
                FROM information_schema.columns 
                WHERE table_name = %s;
            ''', (table_name.lower(),))
            existing_cols = [row[0] for row in cur.fetchall()]

            # Auto-create missing columns
            for col in ordered_cols:
                if col not in existing_cols:
                    print(f'[Auto-Create] Adding column: {col}')
                    cur.execute(f'ALTER TABLE {table_name} ADD COLUMN IF NOT EXISTS \"{col}\" TEXT;')
                    conn.commit()

            # Auto-Drop extra/unwanted columns (keeping 'id' safe)
            for col in existing_cols:
                if col not in ordered_cols and col != 'id':
                    print(f'[Auto-Drop] Removing extra column: {col}')
                    cur.execute(f'ALTER TABLE {table_name} DROP COLUMN \"{col}\";')
                    conn.commit()

            # 4. Truncate table and reset IDs to 1
            print(f'Refreshing {table_name} and resetting IDs to 1...')
            cur.execute(f'TRUNCATE TABLE {table_name} RESTART IDENTITY;')

            # 5. Insert data securely
            cols_string = ', '.join([f'\"{c}\"' for c in ordered_cols])
            placeholders = ', '.join(['%s'] * len(ordered_cols))
            insert_query = f'INSERT INTO {table_name} ({cols_string}) VALUES ({placeholders});'

            rows_data = []
            for rec in all_records:
                row_vals = [rec.get(col) for col in ordered_cols]
                rows_data.append(tuple(row_vals))

            cur.executemany(insert_query, rows_data)
            conn.commit()

            print(f'Successfully saved OHLCV data and cleaned up extra columns in table: {table_name}!')

        except Exception as e:
            conn.rollback()
            print(f'Database error: {e}')
            exit(1)
        finally:
            cur.close()
            conn.close()
        "
